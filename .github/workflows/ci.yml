name: CI/CD

on:
  push:
    branches: [ dev, main, prod ]
  pull_request:
    branches: [ main, prod ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # secrets interdit dans un if: de step → exposé via env
      HAS_FIREBASE_ENV: ${{ secrets.VITE_FIREBASE_PROJECT_ID != '' }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22.x'
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run Tests
      run: yarn test:coverage

    - name: Type Check
      run: yarn type-check

    - name: Lint
      run: yarn lint

    - name: Build
      run: yarn build
      env:
        VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        VITE_LEGAL_NAME: ${{ secrets.VITE_LEGAL_NAME }}
        VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}

    # Qualité : non bloquant (un token Sonar expiré ne doit pas casser la CI)
    - name: SonarCloud Scan
      continue-on-error: true
      uses: SonarSource/sonarqube-scan-action@v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # Déploiement web uniquement depuis prod (= ce qui est publié)
    - name: Deploy to Firebase Hosting
      if: github.ref == 'refs/heads/prod' && env.HAS_FIREBASE_ENV == 'true'
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_REPS_APP }}'
        channelId: live
        projectId: pedro-reps
